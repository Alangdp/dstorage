name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Biome + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # `biome ci` não escreve nada: falha se algo não estiver formatado ou tiver erro de lint.
      - name: Biome (format + lint)
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

  rust:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  build:
    name: Build (${{ matrix.name }})
    needs: [frontend, rust]
    # No merge na main quem compila é o release.yml (só quando há release).
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    env:
      # URL da API embutida no frontend no build. Defina em Settings > Variables.
      VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Tauri (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Build do app
        run: bun run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: dstorage-${{ matrix.name }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
